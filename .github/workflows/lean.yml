name: Lean

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and independently check Lean declarations
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          mk_all-check: true
          nanoda: true
          nanoda-allow-sorry: false

      - name: Report theorem axiom dependencies
        run: lake env lean SimonDCP/AxiomAudit.lean
