name: Lean

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject proof placeholders and project axioms
        run: |
          if rg -n '\b(sorry|admit)\b|^\s*axiom\b' SimonDCP --glob '*.lean'; then
            echo 'Found a proof placeholder or project-local axiom.' >&2
            exit 1
          fi

      - name: Build and kernel-replay Lean declarations
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          mk_all-check: true
          leanchecker: true

      - name: Report theorem axiom dependencies
        run: lake env lean SimonDCP/AxiomAudit.lean
